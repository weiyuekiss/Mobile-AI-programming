<title>AI 编程助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1e1e1e;--bg2:#252526;--bg3:#2d2d2d;--bg4:#3e3e42;--fg:#d4d4d4;--fg2:#858585;--blue:#007acc;--green:#6a9955;--red:#f48771;--yellow:#cca700;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:"Consolas","Courier New",monospace}
body{font-family:var(--font);height:100vh;height:100dvh;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden}
.hdr{padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--bg3);display:flex;align-items:center;gap:8px;flex-shrink:0}
.hdr h1{font-size:14px;white-space:nowrap}
.hdr .cfg-btn{background:none;border:1px solid var(--bg4);color:var(--fg2);padding:4px 10px;border-radius:5px;font-size:12px;cursor:pointer}
.chat-mgr-modal{display:none;position:fixed;inset:0;z-index:100;background:#000a;justify-content:center;align-items:center}
.chat-mgr-modal.show{display:flex}
.chat-mgr-box{background:var(--bg2);border:1px solid var(--bg3);border-radius:12px;width:90%;max-width:440px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
.chat-mgr-hdr{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bg3)}
.chat-mgr-hdr h3{font-size:14px;flex:1}
.chat-mgr-hdr button{background:none;border:none;color:var(--fg2);font-size:16px;cursor:pointer}
.chat-list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.chat-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg3);border-radius:8px;border:1px solid transparent;cursor:pointer;transition:all .15s}
.chat-item.active{border-color:var(--blue);background:#89b4fa15}
.chat-item-info{flex:1;min-width:0}
.chat-item-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.chat-item-sub{font-size:11px;color:var(--fg2);margin-top:2px}
.chat-item-del{background:none;border:none;color:var(--red);padding:4px 6px;cursor:pointer;font-size:13px;border-radius:4px;flex-shrink:0}
.chat-item-del:hover{background:#f38ba822}
.cfg-modal{display:none;position:fixed;inset:0;z-index:100;background:#000a;justify-content:center;align-items:center}
.cfg-modal.show{display:flex}
.cfg-box{background:var(--bg2);border:1px solid var(--bg3);border-radius:12px;padding:20px;width:90%;max-width:420px}
.cfg-box label{display:block;font-size:12px;color:var(--fg2);margin:10px 0 4px}
.cfg-box input{width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--fg);padding:8px;border-radius:6px;font-size:13px}
.cfg-box .row{display:flex;gap:8px;margin-top:14px}
.cfg-box .row button{flex:1;padding:8px;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:13px}
.cfg-box .btn-ok{background:var(--blue);color:var(--bg)}
.cfg-box .btn-test{background:var(--bg3);color:var(--fg);border:1px solid var(--bg4)!important}
.cfg-box .test-result{margin-top:10px;padding:8px;border-radius:6px;font-size:12px;display:none}
.cfg-box .test-result.ok{display:block;background:#a6e3a122;color:var(--green)}
.cfg-box .test-result.fail{display:block;background:#f38ba822;color:var(--red)}
.cfg-box .test-result.loading{display:block;background:var(--bg3);color:var(--fg2)}
.body{flex:1;overflow:hidden;position:relative}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;visibility:hidden;pointer-events:none}
.panel.active{visibility:visible;pointer-events:auto}

.msg{padding:8px 11px;border-radius:8px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word;max-width:92%}
.msg.user{background:var(--bg4);align-self:flex-end}

.msg .abtn{margin-top:5px;padding:3px 9px;background:var(--green);color:var(--bg);border:none;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600}
.msg .abtn.applied{background:var(--bg4);color:var(--fg2)}

.msg .copy-btn:hover{background:var(--bg3);color:var(--fg);opacity:1}

.plan-hdr{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:6px;color:var(--blue);font-size:11px;text-transform:uppercase;letter-spacing:0.5px}
.plan-spinner{width:12px;height:12px;border:2px solid var(--bg4);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.plan-box.scanning::after{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(0,122,204,0.1),transparent);animation:scan 2s infinite;pointer-events:none}

.search-bar button:hover{color:var(--fg)}

.ed-wrap{flex:1;display:flex;overflow:hidden}

#ed{flex:1;width:0;background:var(--bg);color:var(--fg);border:none;padding:10px;font-family:var(--mono);font-size:12px;line-height:1.6;resize:none;tab-size:2;outline:none;white-space:pre;overflow-wrap:normal;-webkit-overflow-scrolling:touch}
.pv-frame{flex:1;border:none;background:#fff;width:100%}
.pv-tools{display:flex;gap:4px;padding:6px 10px;background:var(--bg2);border-top:1px solid var(--bg3);flex-shrink:0;flex-wrap:wrap}
.pv-tools button{background:var(--bg3);border:1px solid var(--bg4);color:var(--fg2);padding:5px 10px;border-radius:4px;font-size:11px;cursor:pointer}

.con{background:#11111b;border-top:1px solid var(--bg3);flex-shrink:0;display:flex;flex-direction:column;max-height:40%}
.con.hidden{display:none}
.con-hdr{display:flex;align-items:center;padding:4px 10px;background:var(--bg2);border-bottom:1px solid var(--bg3);gap:6px;font-size:11px;flex-shrink:0}
.con-hdr span:first-child{flex:1;font-weight:600}
.badge{padding:1px 6px;border-radius:8px;font-size:10px;font-weight:700}

.con-hdr button{background:none;border:none;color:var(--fg2);cursor:pointer;font-size:13px}

.nav{display:flex;background:var(--bg2);border-top:1px solid var(--bg3);flex-shrink:0}
.nav button{flex:1;padding:10px 0;background:none;border:none;color:var(--fg2);font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}

<script>
// ===== IndexedDB 存储 =====
const DB_NAME='ai_coder',DB_VER=1;
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};
    r.onsuccess=e=>{db=e.target.result;res(db)};
    r.onerror=e=>rej(e);
  });
}
function dbPut(key,val){return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(val,key);tx.oncomplete=()=>res();tx.onerror=e=>rej(e)})}
function dbGet(key){return new Promise((res,rej)=>{const tx=db.transaction('kv','readonly');const r=tx.objectStore('kv').get(key);r.onsuccess=()=>res(r.result);r.onerror=e=>rej(e)})}

// ===== 后台保活（静音音频） =====
let keepAliveActive = false, bgAudio = null;

function getSilentAudioUrl(){
  const sampleRate = 8000, duration = 2, numSamples = sampleRate * duration;
  const buffer = new ArrayBuffer(44 + numSamples);
  const view = new DataView(buffer);
  const writeStr = (o, s) => { for(let i=0; i<s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  writeStr(0, 'RIFF'); view.setUint32(4, 36 + numSamples, true);
  writeStr(8, 'WAVE'); writeStr(12, 'fmt ');
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); // PCM
  view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate, true); view.setUint16(32, 1, true);
  view.setUint16(34, 8, true); writeStr(36, 'data');
  view.setUint32(40, numSamples, true);
  for (let i = 0; i < numSamples; i++) view.setUint8(44 + i, 128); // 8-bit PCM 静音
  return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
}

function updateKaBtn(){
  const btn = $('kaBtn');
  if(!btn) return;
  if(keepAliveActive){
    btn.textContent = 'KeepAlive: On';
    btn.style.color = 'var(--green)';
    btn.style.borderColor = 'var(--green)';
  } else {
    btn.textContent = 'KeepAlive: Off';
    btn.style.color = 'var(--fg2)';
    btn.style.borderColor = 'var(--bg4)';
  }
}

async function startKeepAlive(){
  try {
    if(!bgAudio){
      bgAudio = new Audio();
      bgAudio.src = getSilentAudioUrl();
      bgAudio.loop = true;
      bgAudio.setAttribute('playsinline', '');
      bgAudio.setAttribute('webkit-playsinline', '');
    }
    await bgAudio.play();
    keepAliveActive = true;
    if('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({
        title: 'AI手机编程 - 后台保活运行中',
        artist: '系统常驻',
        album: '后台服务'
      });
    }
    updateKaBtn();
    await dbPut('keepAlive', true);
  } catch(e) {
    console.warn('保活音频播放受限，需用户主动触发:', e);
  }
}

function stopKeepAlive(){
  if(bgAudio){
    bgAudio.pause();
    bgAudio.currentTime = 0;
  }
  keepAliveActive = false;
  updateKaBtn();
  dbPut('keepAlive', false);
}

function toggleKeepAlive(){
  if(keepAliveActive) stopKeepAlive();
  else startKeepAlive();
}

// 监听屏幕/可见性切换，确保后台切回或息屏时音频不中断
document.addEventListener('visibilitychange', ()=>{
  if(keepAliveActive && bgAudio && bgAudio.paused){
    bgAudio.play().catch(()=>{});
  }
});

let isLoaded = false;

let planMode = false;

// ===== 对话多会话管理 =====
let chatSessions = []; // { id, title, time, messages: [] }
let currentSessionId = null;

function getCurrentSession(){
  return chatSessions.find(s => s.id === currentSessionId);
}

function syncCurrentSessionMessages(){
  let s = getCurrentSession();
  if(!s){
    s = {
      id: 'chat_' + Date.now(),
      title: '新对话',
      time: Date.now(),
      messages: hist
    };
    chatSessions.unshift(s);
    currentSessionId = s.id;
  } else {
    s.messages = hist;
    s.time = Date.now();
  }
}

function openChatMgr(){
  renderChatList();
  $('chatMgrModal').classList.add('show');
}

function renderChatList(){
  const wrap = $('chatList');
  if(!chatSessions.length){
    wrap.innerHTML = '<div style="color:var(--fg2);text-align:center;padding:30px 0;font-size:12px;">暂无历史记录</div>';
    return;
  }
  wrap.innerHTML = chatSessions.map(s => {
    const isActive = s.id === currentSessionId;
    const dateStr = new Date(s.time).toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const count = s.messages ? s.messages.length : 0;
    const safeTitle = (s.title || '新对话').replace(/"/g, '&quot;');
    return `<div class="chat-item ${isActive ? 'active' : ''}" onclick="switchChatSession('${s.id}')">
      <div class="chat-item-info">
        <div class="chat-item-title">${safeTitle}</div>
        <div class="chat-item-sub">${dateStr} · ${count} 条消息</div>
      </div>
      <button class="chat-item-del" title="删除对话" onclick="event.stopPropagation();delChatSession('${s.id}')">Del</button>
    </div>`;
  }).join('');
}

function switchChatSession(id){
  if(id === currentSessionId){
    $('chatMgrModal').classList.remove('show');
    return;
  }
  syncCurrentSessionMessages();
  const target = chatSessions.find(s => s.id === id);
  if(!target) return;
  currentSessionId = target.id;
  hist = target.messages || [];
  renderMsgs();
  $('chatMgrModal').classList.remove('show');
  autoSave();
}

function delChatSession(id){
  if(!confirm('确定删除此对话记录吗？')) return;
  const idx = chatSessions.findIndex(s => s.id === id);
  if(idx === -1) return;
  chatSessions.splice(idx, 1);
  if(currentSessionId === id){
    if(chatSessions.length > 0){
      currentSessionId = chatSessions[0].id;
      hist = chatSessions[0].messages || [];
    } else {
      currentSessionId = 'chat_' + Date.now();
      hist = [];
      chatSessions.push({ id: currentSessionId, title: '新对话', time: Date.now(), messages: [] });
    }
    renderMsgs();
  }
  renderChatList();
  autoSave();
}

function renderMsgs(){
  $('msgs').innerHTML = '';
  hist.forEach(h => {
    if(h.role === 'user') addMsg('user', h.content);
    else if(h.role === 'assistant') addMsg('ai', h.content);
  });
}

async function fetchModelList(){
  const key=$('key').value.trim(), base=$('base').value.trim();
  const tr=$('testResult');
  const sel=$('modelSelect');
  if(!key||!base){
    tr.className='test-result fail';
    tr.textContent='Error: 请先填写 Key 和 API Base URL';
    return;
  }
  tr.className='test-result loading';
  tr.textContent='Loading: 正在获取可用模型列表...';
  try{
    const url = base.replace(/\/+$/, '') + '/models';
    const res = await fetch(url, {
      method: 'GET',
      headers: { 'Authorization': `Bearer ${key}` }
    });
    const data = await res.json();
    let list = Array.isArray(data) ? data : (data.data || []);
    if(!list || !list.length){
      throw new Error(data.error?.message || '未能拉取到模型列表');
    }
    const modelIds = list.map(m => typeof m === 'string' ? m : m.id).filter(Boolean).sort();
    sel.innerHTML = '<option value="">▼ 选择模型</option>' + modelIds.map(m => `<option value="${m}">${m}</option>`).join('');
    sel.style.display = 'block';
    tr.className = 'test-result ok';
    tr.textContent = `Success: 成功拉取 ${modelIds.length} 个模型，请选择或输入`;
  }catch(e){
    tr.className = 'test-result fail';
    tr.textContent = `Error: 获取失败: ${e.message}`;
  }
}

// ===== AI =====
function parseEdits(t){const e=[];const r=/<<<<<<< SEARCH\n([\s\S]*?)\n=======\n([\s\S]*?)\n>>>>>>> REPLACE/g;let m;while((m=r.exec(t))!==null)e.push({s:m[1],r:m[2]});return e}
// 多级容错定位：返回 {start,end} 字符区间，找不到返回 null
function locateMatch(code, search){
  // ---- 0. 预处理 ----
  if(search==='') return null;

  // ---- 1. 精确匹配 ----
  let idx = code.indexOf(search);
  if(idx !== -1) return {start: idx, end: idx + search.length};

  // ---- 2. 去首尾空白后精确匹配 ----
  const trimmed = search.trim();
  if(trimmed){
    idx = code.indexOf(trimmed);
    if(idx !== -1) return {start: idx, end: idx + trimmed.length};
  }

  // ---- 准备按行索引 ----
  const codeLines = code.split('\n');
  const offsets = []; // 每行起始字符下标
  let p = 0;
  for(const l of codeLines){ offsets.push(p); p += l.length + 1; }
  const rangeOf = (a, b) => ({ start: offsets[a], end: offsets[b] + codeLines[b].length });

  // 规范化：折叠所有空白为单个空格并去首尾
  const norm = s => s.replace(/\s+/g, ' ').trim();

  // search 去掉首尾空行
  let sLines = search.split('\n');
  while(sLines.length && sLines[0].trim() === '') sLines.shift();
  while(sLines.length && sLines[sLines.length - 1].trim() === '') sLines.pop();
  if(!sLines.length) return null;

  const nSearch = sLines.map(norm);
  const nCode = codeLines.map(norm);
  const N = nSearch.length;

  // 相似度：基于 token 的 Dice 系数（0~1）
  const sim = (a, b) => {
    if(a === b) return 1;
    if(!a && !b) return 1;
    if(!a || !b) return 0;
    const ta = a.split(' ').filter(Boolean), tb = b.split(' ').filter(Boolean);
    if(!ta.length && !tb.length) return 1;
    const setB = {}; tb.forEach(t => setB[t] = (setB[t] || 0) + 1);
    let inter = 0;
    for(const t of ta){ if(setB[t] > 0){ inter++; setB[t]--; } }
    return (2 * inter) / (ta.length + tb.length);
  };

  if(N <= nCode.length){
    // ---- 3. 按行规范化后整块精确匹配 ----
    for(let i = 0; i <= nCode.length - N; i++){
      let hit = true;
      for(let j = 0; j < N; j++){ if(nCode[i + j] !== nSearch[j]){ hit = false; break; } }
      if(hit) return rangeOf(i, i + N - 1);
    }

    // ---- 4. 按行相似度模糊匹配（取整块平均相似度最高者）----
    let best = -1, bestScore = 0;
    for(let i = 0; i <= nCode.length - N; i++){
      let sc = 0;
      for(let j = 0; j < N; j++) sc += sim(nCode[i + j], nSearch[j]);
      sc /= N;
      if(sc > bestScore){ bestScore = sc; best = i; }
    }
    if(best !== -1 && bestScore >= 0.7) return rangeOf(best, best + N - 1);
  }

  // ---- 5. 首尾行锚点匹配（中间内容差异较大时）----
  if(N >= 2){
    const firstA = nSearch[0], lastA = nSearch[N - 1];
    const matchLine = (line, anchor) => line === anchor || sim(line, anchor) >= 0.8;
    for(let i = 0; i < nCode.length; i++){
      if(matchLine(nCode[i], firstA)){
        for(let k = i + 1; k < nCode.length; k++){
          if(matchLine(nCode[k], lastA)) return rangeOf(i, k);
        }
      }
    }
  }

  // ---- 6. 单行模糊匹配兜底 ----
  if(N === 1){
    let bi = -1, bs = 0;
    for(let i = 0; i < nCode.length; i++){
      const s = sim(nCode[i], nSearch[0]);
      if(s > bs){ bs = s; bi = i; }
    }
    if(bi !== -1 && bs >= 0.6) return rangeOf(bi, bi);
  }

  return null;
}

function applyEdits(edits,btn){
  if(!cur)return;
  F[cur]=$('ed').value;
  let code=F[cur].replace(/\r\n/g, '\n');
  let ok=0, fail=[];

  for(const e of edits){
    const searchStr = e.s.replace(/\r\n/g, '\n');
    const replaceStr = e.r.replace(/\r\n/g, '\n');
    const m = locateMatch(code, searchStr);
    if(m){
      code = code.slice(0, m.start) + replaceStr + code.slice(m.end);
      ok++;
    } else {
      fail.push(e.s.slice(0, 40) + '...');
    }
  }

  F[cur]=code;
  $('ed').value=code;
  pushState(code);
  updLn();
  autoSave();
  btn.textContent=fail.length?`Warning: ${ok}/${edits.length} (部分失败)`:`Applied: ${ok}处已应用`;
  btn.classList.add('applied');
  btn.disabled=true;
  if(fail.length) alert('部分代码块无法匹配，请检查AI返回的格式是否正确:\n' + fail.join('\n'));
}
function copyText(txt, btn){
  navigator.clipboard.writeText(txt).then(()=>{
    const old = btn.textContent;
    btn.textContent = 'Copied';
    setTimeout(()=>btn.textContent = old, 1500);
  }).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = txt;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const old = btn.textContent;
    btn.textContent = 'Copied';
    setTimeout(()=>btn.textContent = old, 1500);
  });
}

function doSearch(focusEditor = false){
  const kw = $('findInp').value;
  searchMatches = [];
  curSearchIdx = -1;
  if(!kw){
    $('findCnt').textContent = '0/0';
    return;
  }
  const text = $('ed').value;
  const kwLower = kw.toLowerCase();
  const textLower = text.toLowerCase();
  const step = Math.max(1, kw.length);
  let pos = 0;
  // 安全匹配上限 1000 处，避免极大文件造成主线程卡死
  while((pos = textLower.indexOf(kwLower, pos)) !== -1 && searchMatches.length < 1000){
    searchMatches.push(pos);
    pos += step;
  }
  if(searchMatches.length > 0){
    // 定位离当前光标最近的匹配项
    const selStart = $('ed').selectionStart;
    let foundIdx = searchMatches.findIndex(p => p >= selStart);
    curSearchIdx = foundIdx !== -1 ? foundIdx : 0;
    highlightSearchMatch(focusEditor);
  } else {
    $('findCnt').textContent = '0/0';
  }
}

function findNext(delta){
  if(!searchMatches.length){
    doSearch(false);
    if(!searchMatches.length) return;
  }
  curSearchIdx = (curSearchIdx + delta + searchMatches.length) % searchMatches.length;
  highlightSearchMatch(false);
}

function highlightSearchMatch(focusEditor = false){
  if(curSearchIdx < 0 || curSearchIdx >= searchMatches.length) return;
  const start = searchMatches[curSearchIdx];
  const kwLen = $('findInp').value.length;
  const ed = $('ed');
  
  // 绝不在搜索打字时夺取焦点，保证退格和输入始终停留在搜索框中
  if(focusEditor){
    ed.focus();
  }
  ed.setSelectionRange(start, start + kwLen);

  // 平滑滚动代码区域至匹配行
  const lineNo = ed.value.slice(0, start).split('\n').length;
  const lineHeight = 12 * 1.6;
  ed.scrollTop = Math.max(0, (lineNo - 4) * lineHeight);
  $('ln').scrollTop = ed.scrollTop;

  $('findCnt').textContent = `${curSearchIdx + 1}/${searchMatches.length}${searchMatches.length >= 1000 ? '+' : ''}`;
}

function addMsg(role,content){
  const d=document.createElement('div');d.className=`msg ${role}`;
  
  let text = '';
  const imgUrls = [];
  if (Array.isArray(content)) {
    content.forEach(item => {
      if (item.type === 'text') text = item.text;
      if (item.type === 'image_url') imgUrls.push(item.image_url.url || item.image_url);
    });
  } else {
    text = content;
  }

  if (imgUrls.length > 0) {
    const imgGrid = document.createElement('div');
    imgGrid.style.display = 'flex';
    imgGrid.style.flexWrap = 'wrap';
    imgGrid.style.gap = '6px';
    imgGrid.style.marginBottom = '6px';
    imgUrls.forEach(url => {
      const img = document.createElement('img');
      img.src = url;
      img.style.maxWidth = imgUrls.length > 1 ? '48%' : '100%';
      img.style.maxHeight = '180px';
      img.style.borderRadius = '6px';
      img.style.objectFit = 'cover';
      img.style.cursor = 'pointer';
      img.onclick = () => {
        const w = window.open();
        w.document.write(`<img src="${url}" style="max-width:100%">`);
      };
      imgGrid.appendChild(img);
    });
    d.appendChild(imgGrid);
  }

  const s=document.createElement('span');s.textContent=text;d.appendChild(s);
  
  if(role==='user' && text){
    const copyBar = document.createElement('div');
    const cpBtn = document.createElement('button');
    cpBtn.className = 'copy-btn';
    cpBtn.textContent = 'Copy Text';
    cpBtn.onclick = () => copyText(text, cpBtn);
    copyBar.appendChild(cpBtn);
    d.appendChild(copyBar);
  }

  if(role==='ai'){
    attachAiActions(d, text);
  }
  $('msgs').appendChild(d);$('msgs').scrollTop=99999;
}

function attachAiActions(dom, text){
  const edits=parseEdits(text);
  if(edits.length){const b=document.createElement('button');b.className='abtn';b.textContent=`Apply ${edits.length} Edits`;b.onclick=()=>applyEdits(edits,b);dom.appendChild(b)}
  const cb=[...text.matchAll(/```[\w]*\n([\s\S]*?)```/g)];
  if(!edits.length&&cb.length){const b=document.createElement('button');b.className='abtn';b.textContent='Replace File';b.onclick=()=>{if(!cur)return; F[cur]=cb.map(m=>m[1].trim()).join('\n\n');$('ed').value=F[cur];pushState(F[cur]);updLn();autoSave();b.textContent='Applied';b.classList.add('applied');b.disabled=true};dom.appendChild(b)}
  
  const copyBar = document.createElement('div');
  const cpBtn = document.createElement('button');
  cpBtn.className = 'copy-btn';
  cpBtn.textContent = 'Copy Reply';
  cpBtn.onclick = () => copyText(text, cpBtn);
  copyBar.appendChild(cpBtn);
  dom.appendChild(copyBar);
}

function createAiStreamMsg(){
  const d = document.createElement('div');
  d.className = 'msg ai';
  
  const planBox = document.createElement('div');
  planBox.className = 'plan-box scanning';
  const planHdr = document.createElement('div');
  planHdr.className = 'plan-hdr';
  planHdr.innerHTML = '<div class="plan-spinner"></div><span>Planning & Reasoning...</span>';
  const planContent = document.createElement('div');
  planBox.appendChild(planHdr);
  planBox.appendChild(planContent);
  
  const span = document.createElement('span');
  d.appendChild(planBox);
  d.appendChild(span);
  
  $('msgs').appendChild(d);
  $('msgs').scrollTop = 99999;
  
  const render = (text) => {
    let out = text;
    const pm = text.match(/<plan>([\s\S]*?)(?:<\/plan>|$)/);
    if(pm){
      planBox.style.display = 'block';
      planContent.textContent = pm[1].trim();
      out = text.replace(/<plan>([\s\S]*?)(?:<\/plan>|$)/, '').trim();
      if(text.includes('</plan>')){
        planBox.classList.remove('scanning');
        planHdr.innerHTML = '<span style="color:var(--green)">✓</span><span>Plan Completed</span>';
      }
    }
    span.textContent = out;
  };

  return {
    dom: d,
    append(text){
      render(text);
      $('msgs').scrollTop = 99999;
    },
    finish(finalText){
      render(finalText);
      attachAiActions(d, finalText);
      $('msgs').scrollTop = 99999;
    }
  };
}

let pendingImages = []; // 存储多张 base64 图片

function compressImageFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1024;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          } else {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function previewImgs(input) {
  const files = [...input.files];
  if (!files.length) return;
  for (const f of files) {
    try {
      const b64 = await compressImageFile(f);
      pendingImages.push(b64);
    } catch (e) {
      console.error('图片压缩失败', e);
    }
  }
  input.value = '';
  renderImgPreviews();
}

function removeImg(idx) {
  pendingImages.splice(idx, 1);
  renderImgPreviews();
}

function renderImgPreviews() {
  const wrap = $('imgPreviewWrap');
  const list = $('imgThumbList');
  if (!pendingImages.length) {
    wrap.style.display = 'none';
    list.innerHTML = '';
    return;
  }
  wrap.style.display = 'flex';
  list.innerHTML = pendingImages.map((b64, idx) => `
    <div style="position:relative;flex-shrink:0;display:inline-block">
      <img src="${b64}" style="height:44px;width:44px;border-radius:4px;object-fit:cover;border:1px solid var(--bg4);display:block">
      <button onclick="removeImg(${idx})" style="background:var(--red);color:var(--bg);border:none;border-radius:50%;width:16px;height:16px;font-size:10px;cursor:pointer;position:absolute;top:-4px;right:-4px;display:flex;align-items:center;justify-content:center;font-weight:bold">×</button>
    </div>
  `).join('');
}

function clearImg() {
  pendingImages = [];
  renderImgPreviews();
}

async function send(){
  let msg=$('inp').value.trim();
  
  if (cur && $('ed').selectionStart !== $('ed').selectionEnd) {
    const selCode = $('ed').value.substring($('ed').selectionStart, $('ed').selectionEnd);
    if (selCode.trim()) {
      msg += `\n\n[编辑器选中的代码片段]:\n\`\`\`\n${selCode}\n\`\`\``;
    }
  }

  if(!msg && !pendingImages.length) return;
  const key=$('key').value.trim(),base=$('base').value.trim(),model=$('model').value.trim();
  if(!key||!base||!model){$('cfgModal').classList.add('show');return}
  
  let userContent = msg;
  if(pendingImages.length > 0) {
    userContent = [
      { type: 'text', text: msg || `请分析这 ${pendingImages.length} 张图片。` },
      ...pendingImages.map(b64 => ({ type: 'image_url', image_url: { url: b64, detail: 'low' } }))
    ];
  }

  $('inp').value='';
  clearImg();
  
  addMsg('user', userContent);
  if(cur)F[cur]=$('ed').value;
  hist.push({role:'user',content:userContent});
  
  let s = getCurrentSession();
  if(s && (s.title === '新对话' || s.title === '历史会话')){
    let promptTitle = typeof userContent === 'string' ? userContent : (userContent[0]?.text || '图片分析');
    s.title = promptTitle.slice(0, 24).trim();
  }
  autoSave();

  let sys = SYS;
  if (cur) {
    sys += `\n\n当前文件:${cur}\n完整代码:\n\`\`\`\n${F[cur]}\n\`\`\``;
  }

  // 发送完整对话历史
  const cleanMessages = hist.map((m, idx) => {
    const isLatest = idx === hist.length - 1;
    let contentToSend = m.content;
    
    if (isLatest && planMode && m.role === 'user') {
      const planReq = "\n\n[System Req: Please use maximum attention to execute this task. You must output your step-by-step thinking and plan inside <plan>...</plan> tags FIRST, BEFORE writing any code.]";
      if (typeof contentToSend === 'string') {
        contentToSend += planReq;
      } else if (Array.isArray(contentToSend)) {
        contentToSend = [...contentToSend];
        const tIdx = contentToSend.findIndex(c => c.type === 'text');
        if (tIdx > -1) contentToSend[tIdx] = { ...contentToSend[tIdx], text: contentToSend[tIdx].text + planReq };
      }
    }

    if (Array.isArray(contentToSend)) {
      if (isLatest) return { role: m.role, content: contentToSend };
      const textOnly = contentToSend
        .filter(c => c.type === 'text')
        .map(c => c.text)
        .join('\n');
      const imgCount = contentToSend.filter(c => c.type === 'image_url').length;
      return { role: m.role, content: (textOnly || '分析图片') + `\n[上一轮已分析过的 ${imgCount} 张图片]` };
    }
    return { role: m.role, content: contentToSend };
  });

  $('btn').disabled=true;
  const streamUi = createAiStreamMsg();
  let fullReply = '';

  try{
    const res=await fetch(`${base}/chat/completions`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},
      body:JSON.stringify({model,messages:[{role:'system',content:sys},...cleanMessages],temperature:1,stream: true})
    });

    if(!res.ok){
      const errText = await res.text();
      throw new Error(`HTTP ${res.status}: ${errText}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';

    while(true){
      const { done, value } = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for(const line of lines){
        const trimmed = line.trim();
        if(!trimmed || !trimmed.startsWith('data:')) continue;
        const dataStr = trimmed.replace(/^data:\s*/, '');
        if(dataStr === '[DONE]') continue;
        try{
          const json = JSON.parse(dataStr);
          const chunk = json.choices?.[0]?.delta?.content || '';
          if(chunk){
            fullReply += chunk;
            streamUi.append(fullReply);
          }
        }catch(ignore){}
      }
    }

    if(!fullReply){
      fullReply = '(空回复)';
    }

    hist.push({role:'assistant',content:fullReply});
    streamUi.finish(fullReply);
    autoSave();
  }catch(e){
    streamUi.finish('请求出错: ' + e.message);
  }
  $('btn').disabled=false;
}
